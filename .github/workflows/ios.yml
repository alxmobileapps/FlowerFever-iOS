name: iOS Build (Simulator test + TestFlight upload)

# Builds the Flower Fever iPhone app (Capacitor) on a cloud Mac - no Mac needed.
#
# Every run:  compiles the app for the iPhone Simulator (no Apple account needed), so the Actions tab
#             shows whether the code builds.
# With the Apple secrets set: also builds a signed release and UPLOADS IT TO APP STORE CONNECT / TESTFLIGHT.
#
# The ios/ native project is not committed: it is made fresh each run with `cap add ios`, then patched
# (scripts/ios/patch-ios-project.sh). The game page is built from the patches (scripts/build-web.sh).
#
# Secrets (Settings -> Secrets and variables -> Actions -> Secrets) - the same ones as AlphaBlast-iOS:
#   APPLE_TEAM_ID   10-character Team ID (developer.apple.com -> Membership)
#   ASC_KEY_ID      App Store Connect API key id
#   ASC_ISSUER_ID   App Store Connect API issuer id
#   ASC_KEY_P8      the full text of the AuthKey_XXXX.p8 file (ASC_KEY_P8_BASE64 = base64 of it also works)
# Variables (optional): IOS_APP_VERSION (default 1.0.0)
#
# Firebase (sign-in, cloud save, friends, analytics): put GoogleService-Info.plist in the repo root.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'scripts/ios/iap_setup.py'
      - '.github/workflows/iap-setup.yml'
      - 'resources/iap-review.png'
      - 'appstore/**'
      - '.github/workflows/appstore.yml'
  workflow_dispatch: {}

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 75
    env:
      IOS_APP_VERSION: ${{ vars.IOS_APP_VERSION || '1.0.0' }}
      IOS_BUILD_NUMBER: ${{ github.run_number }}
      WORKSPACE: ios/App/App.xcworkspace
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use latest stable Xcode (the App Store needs a current SDK)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Capacitor + plugins
        run: |
          npm install
          if [ -f GoogleService-Info.plist ]; then
            echo "Firebase config found: adding Apple + Google sign-in, cloud save (Firestore) and Analytics"
            npm install @capacitor-firebase/authentication@7.5.0 @capacitor-firebase/firestore@7.5.0 @capacitor-firebase/analytics@7.5.0 firebase@^11
            echo "window.FLOWER_FIREBASE = true;" > www/firebase-config.js
          else
            echo "window.FLOWER_FIREBASE = false;" > www/firebase-config.js
          fi

      - name: Build the game page (same patches as Android build 100 + iPhone changes)
        run: bash scripts/build-web.sh

      - name: Create the iOS project (CocoaPods, so the in-app purchase plugin works)
        run: npx cap add ios --packagemanager CocoaPods

      - name: App Store setup (Info.plist, privacy manifest, Sign in with Apple, Firebase)
        run: bash scripts/ios/patch-ios-project.sh

      - name: Sync Capacitor -> iOS
        run: |
          npx cap sync ios
          echo "Native pods:"; grep -E "^  - [A-Za-z]" ios/App/Podfile.lock | cut -d' ' -f4 | sort -u | tr '\n' ' '; echo

      - name: App icon + splash from the Flower Fever artwork
        run: |
          mkdir -p assets
          cp resources/app-icon.png assets/icon.png
          cp resources/app-icon.png assets/splash.png
          npx --yes @capacitor/assets@3 generate --ios --iconBackgroundColor '#00342e' --splashBackgroundColor '#fdf8f1'
          # the App Store rejects app icons with transparency: flatten them
          for f in ios/App/App/Assets.xcassets/AppIcon.appiconset/*.png; do
            sips -s format jpeg "$f" --out /tmp/icon.jpg >/dev/null
            sips -s format png /tmp/icon.jpg --out "$f" >/dev/null
          done

      - name: Test build for the iPhone Simulator (no signing)
        run: |
          set -o pipefail
          xcodebuild -workspace "$WORKSPACE" -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO TARGETED_DEVICE_FAMILY=1 build | tail -n 60

      - name: Check for Apple signing secrets
        id: signing_check
        run: |
          if { [ -n "${{ secrets.ASC_KEY_P8 }}" ] || [ -n "${{ secrets.ASC_KEY_P8_BASE64 }}" ]; } && [ -n "${{ secrets.APPLE_TEAM_ID }}" ]; then
            echo "has_apple=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_apple=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Apple secrets not set yet - skipped the signed build / TestFlight upload. See SETUP_IOS.md."
          fi

      - name: Apple API key + App ID (and Sign in with Apple on it)
        if: steps.signing_check.outputs.has_apple == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          if [ -n "$ASC_KEY_P8" ]; then RAW="$ASC_KEY_P8"; else RAW="$(echo "$ASC_KEY_P8_BASE64" | base64 --decode)"; fi
          # rebuild a clean PEM however it was pasted
          BODY="$(printf '%s' "$RAW" | sed -e 's/-----BEGIN PRIVATE KEY-----//' -e 's/-----END PRIVATE KEY-----//' | tr -d ' \t\r\n')"
          { echo "-----BEGIN PRIVATE KEY-----"; printf '%s\n' "$(printf '%s' "$BODY" | fold -w 64)"; echo "-----END PRIVATE KEY-----"; } > "$KEY_PATH"
          pip3 install --quiet --break-system-packages pyjwt cryptography requests 2>/dev/null || pip3 install --quiet pyjwt cryptography requests
          FLAG=""; [ -f GoogleService-Info.plist ] && FLAG="--apple-signin"
          ASC_KEY_PATH="$KEY_PATH" python3 scripts/ios/apple_id.py $FLAG

      - name: Build release archive (signed at export)
        if: steps.signing_check.outputs.has_apple == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild -workspace "$WORKSPACE" -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/FlowerFever.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            TARGETED_DEVICE_FAMILY=1 \
            MARKETING_VERSION="$IOS_APP_VERSION" CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER" \
            archive | tail -n 40
          # the archive is unsigned, so it has no entitlements yet: ad-hoc sign it with them;
          # the App Store export re-signs it and keeps what the App ID allows (Sign in with Apple)
          if [ -f ios/App/App/App.entitlements ]; then
            APP="$RUNNER_TEMP/FlowerFever.xcarchive/Products/Applications/App.app"
            codesign --force --deep --sign - --timestamp=none "$APP"
            codesign --force --sign - --timestamp=none --entitlements ios/App/App/App.entitlements "$APP"
          fi

      - name: Upload to App Store Connect / TestFlight
        if: steps.signing_check.outputs.has_apple == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          set -o pipefail
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          if [ -f ios/App/App/App.entitlements ]; then
            # export locally first and make sure the signed app really has Sign in with Apple
            sed 's#<string>upload</string>#<string>export</string>#' "$RUNNER_TEMP/ExportOptions.plist" > "$RUNNER_TEMP/ExportCheck.plist"
            xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/FlowerFever.xcarchive" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportCheck.plist" -exportPath "$RUNNER_TEMP/check" "${AUTH[@]}" | tail -n 15
            IPA="$(ls "$RUNNER_TEMP"/check/*.ipa | head -n1)"
            mkdir -p "$RUNNER_TEMP/ipa" && unzip -q "$IPA" -d "$RUNNER_TEMP/ipa"
            codesign -d --entitlements :- "$RUNNER_TEMP"/ipa/Payload/*.app 2>/dev/null > "$RUNNER_TEMP/ent.txt" || true
            cat "$RUNNER_TEMP/ent.txt"
            grep -q applesignin "$RUNNER_TEMP/ent.txt" || { echo "::error::The App Store build has no Sign in with Apple entitlement - not uploading."; exit 1; }
          fi
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/FlowerFever.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
          echo "::notice::Uploaded build $IOS_BUILD_NUMBER (v$IOS_APP_VERSION) to App Store Connect. It shows up in TestFlight after Apple finishes processing (~10-30 min)."
